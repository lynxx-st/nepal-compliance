map $http_upgrade $connection_upgrade_chat {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name chat.shrijalpaudel.com.np;

    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 50m;

    # PWA manifest — installable as standalone "Chat" app
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
        return 200 '{"name":"Nepal Chat","short_name":"Chat","description":"Team messaging powered by Raven","start_url":"/","scope":"/","display":"standalone","background_color":"#ffffff","theme_color":"#4f46e5","icons":[{"src":"/assets/raven/frontend/manifest/manifest-icon-192.maskable.png","sizes":"192x192","type":"image/png","purpose":"any maskable"},{"src":"/assets/raven/frontend/manifest/manifest-icon-512.maskable.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}';
    }

    # Service worker
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        return 200 'self.addEventListener("install",function(e){self.skipWaiting();});self.addEventListener("activate",function(e){e.waitUntil(clients.claim());});self.addEventListener("fetch",function(e){if(e.request.mode==="navigate"){e.respondWith(fetch(e.request).catch(function(){return caches.match("/");}));}});';
    }

    # WebSocket for socket.io
    location /socket.io {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_chat;
        proxy_set_header Host erp.shrijalpaudel.com.np;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Assets, API, auth, files — pass directly to backend (no /raven prefix)
    location ~ ^/(assets|api|login|logout|files|private|auth|app|desk)(/.*)?$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host erp.shrijalpaudel.com.np;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # /raven paths — pass through directly to backend (Vue Router SPA navigation)
    # No redirect! Vue Router uses /raven as its base, so internal links are /raven/...
    location /raven {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host erp.shrijalpaudel.com.np;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Root and all other paths → rewrite to /raven (entry point for chat)
    location / {
        rewrite ^/(.*)$ /raven/$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host erp.shrijalpaudel.com.np;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
