name: Build and Push
on:
  push:
    branches:
      - main
      - development
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

env:
  TZ: /usr/share/zoneinfo/Asia/Kathmandu
  # 1m cache segment restore timeout to stop wasting resource time
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
  REGISTRY: docker.io
  IMAGE_NAME: lynxxstein/nepal-compliance
  APPS_JSON: ${{ vars.APPS_JSON }}

# workflow can only read this repo’s code but cannot change
# workflow can push Docker or GHCR images
permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: amd64
            os: ubuntu-24.04
            platform: linux/amd64
          - name: arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      metadata: ${{ steps.meta.outputs.json }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/development' }}

      - name: Clone frappe_docker
        run: git clone --depth=1 https://github.com/frappe/frappe_docker

      - name: Patch Containerfile to install bun (required by frappe/mail)
        run: |
          python3 -c "
          f='frappe_docker/images/custom/Containerfile'
          c=open(f).read()
          c=c.replace('&& chown -R frappe:frappe /run/nginx.pid \\\\','&& chown -R frappe:frappe /run/nginx.pid \\\\\n    && chown -R frappe:frappe /home/frappe/.nvm \\\\',1)
          open(f,'w').write(c)
          print('patched: nvm dir ownership fixed for frappe user (needed by frappe/mail bun install)')
          "

      - name: Copy frappe/mail patches into Docker build context
        run: |
          mkdir -p frappe_docker/frappe_patches
          cp frappe_patches/*.py frappe_docker/frappe_patches/

      - name: Inject frappe/mail patch RUN steps into Containerfile
        run: |
          python3 -c "
          f = 'frappe_docker/images/custom/Containerfile'
          c = open(f).read()
          # Insert COPY + RUN steps before the last USER frappe line
          patch_block = '''
          COPY frappe_patches/ /tmp/frappe_patches/
          RUN python3 /tmp/frappe_patches/fix_jmap_connection.py
          RUN python3 /tmp/frappe_patches/fix_jmap_user_settings.py
          RUN python3 /tmp/frappe_patches/fix_jmap_account_api.py
          RUN python3 /tmp/frappe_patches/fix_pwa_setup.py
          '''
          # Find the last USER frappe occurrence
          idx = c.rfind('\nUSER frappe')
          if idx == -1:
              print('ERROR: USER frappe not found in Containerfile')
              exit(1)
          c = c[:idx] + '\n' + patch_block.strip() + c[idx:]
          open(f, 'w').write(c)
          print('patched: Containerfile will apply frappe/mail jmap fixes during build')
          "

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          context: ./frappe_docker
          platforms: ${{ matrix.platform }}
          file: frappe_docker/images/custom/Containerfile
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            PYTHON_VERSION=3.14.2
            NODE_VERSION=24.13.0
          secrets: |
            apps_json=${{ vars.APPS_JSON }}

      - name: Export digest
        id: digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/development' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect $(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

  deploy:
    runs-on: ubuntu-24.04
    needs: merge
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Oracle Cloud VM
        uses: appleboy/ssh-action@v1
        with:
          host: 213.35.96.115
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/nepal-compliance

            # Pull latest code (compose.yaml, etc.) from main (production branch)
            git pull origin main

            # Pull new Docker image
            docker compose pull

            # Restart all services with new image (zero-downtime for stateless services)
            docker compose up -d --remove-orphans

            # Restart frontend to re-resolve backend IP after container recreation
            sleep 5
            docker compose restart frontend

            # Reload frontend nginx to pick up new backend IP
            docker exec nepal-compliance-frontend-1 nginx -s reload || true

            # Clean up old images to save disk space
            docker image prune -f

            echo "Deploy complete: $(date)"

      - name: Purge Cloudflare cache
        if: ${{ vars.CLOUDFLARE_ZONE_ID != '' }}
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ vars.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | jq '.success'
