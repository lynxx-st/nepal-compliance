name: Label Large PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  label-large-pr:
    runs-on: ubuntu-24.04

    steps:
      - name: Check if "large-pr" label exists
        uses: actions/github-script@v7
        with:
          script: |
            const labelName = 'large-pr';
            const labelColor = 'BC5834';
            const labelDescription = 'Pull request with over 300 LOC changed.';

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
              });
            } catch (error) {
              if (error.status === 404) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: labelName,
                    color: labelColor,
                    description: labelDescription,
                  });
                } catch (createError) {
                  if (createError.status === 403) {
                    core.warning('Token cannot create labels for this pull request; skipping large-pr label creation.');
                    return;
                  }
                  throw createError;
                }
              } else {
                throw error;
              }
            }

      - name: Label Large PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;

            const { data: files } = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: prNumber,
            });

            const totalChanges = files.reduce((sum, file) => {
              return sum + file.additions + file.deletions;
            }, 0);

            if (totalChanges > 300) {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: prNumber,
                  labels: ['large-pr'],
                });
                console.log('Label "large-pr" added.');
              } catch (error) {
                if (error.status === 403 || error.status === 404) {
                  core.warning('Token cannot add the large-pr label for this pull request; skipping.');
                  return;
                }
                throw error;
              }
            } else {
              const { data: labels } = await github.rest.issues.listLabelsOnIssue({
                owner,
                repo,
                issue_number: prNumber,
              });
              if (labels.some(label => label.name === 'large-pr')) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: prNumber,
                    name: 'large-pr',
                  });
                  console.log('Label "large-pr" removed.');
                } catch (error) {
                  if (error.status === 403 || error.status === 404) {
                    core.warning('Token cannot remove the large-pr label for this pull request; skipping.');
                    return;
                  }
                  throw error;
                }
              } else {
                console.log('Label "large-pr" not present, nothing to remove.');
              }
            }
