name: Release Deploy

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to deploy
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build_release_image:
    name: Build release image
    uses: ./.github/workflows/docker-build.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      release_tag: ${{ github.event.release.tag_name || inputs.release_tag }}
    secrets: inherit

  deploy:
    name: Deploy to self-hosted server
    needs: build_release_image
    runs-on: ubuntu-24.04
    environment: production
    env:
      PROD_SERVER_HOST: ${{ vars.PROD_SERVER_HOST || '45.115.217.121' }}
      PROD_SERVER_USER: ${{ vars.PROD_SERVER_USER || 'flagforge' }}
      PROD_DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH || '/home/flagforge/nepal-compliance' }}
      FRAPPE_SITE: ${{ vars.FRAPPE_SITE || 'frontend' }}
      REQUIRED_FRAPPE_APPS: ${{ vars.REQUIRED_FRAPPE_APPS || 'erpnext,hrms,crm,print_designer,insights,mail,raven,nepal_compliance' }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      IMAGE_REF: docker.io/${{ vars.IMAGE_NAME || 'lynxxstein/nepal-compliance' }}:${{ github.event.release.tag_name || inputs.release_tag }}
      REPOSITORY_URL: https://github.com/${{ github.repository }}.git
    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROD_SERVER_HOST}"
          test -n "${PROD_SERVER_USER}"
          test -n "${IMAGE_REF}"

      - name: SSH production preflight
        uses: appleboy/ssh-action@v1
        env:
          PROD_DEPLOY_PATH: ${{ env.PROD_DEPLOY_PATH }}
          FRAPPE_SITE: ${{ env.FRAPPE_SITE }}
          REQUIRED_FRAPPE_APPS: ${{ env.REQUIRED_FRAPPE_APPS }}
        with:
          host: ${{ env.PROD_SERVER_HOST }}
          username: ${{ env.PROD_SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          envs: PROD_DEPLOY_PATH,FRAPPE_SITE,REQUIRED_FRAPPE_APPS
          script: |
            set -euo pipefail
            cd "$PROD_DEPLOY_PATH"

            command -v docker >/dev/null
            docker compose version
            test -d .git
            test -f compose.yaml

            available_kb="$(df -Pk . | awk 'NR==2 {print $4}')"
            if [[ "$available_kb" -le 2097152 ]]; then
              docker image inspect yarsalabs/nepal-compliance:latest >/dev/null 2>&1 || {
                echo "Less than 2 GiB available and no approved legacy image can be reclaimed"
                exit 1
              }
              echo "Low disk space accepted for one-time replacement of the approved legacy image"
            fi

            docker compose ps

            docker compose exec -T backend bench --site "$FRAPPE_SITE" list-apps
            docker compose exec -T backend bench --site "$FRAPPE_SITE" execute frappe.db.exists --args '["User", "Administrator"]' | grep -qi "true"

      - name: Deploy by SSH
        uses: appleboy/ssh-action@v1
        env:
          PROD_DEPLOY_PATH: ${{ env.PROD_DEPLOY_PATH }}
          FRAPPE_SITE: ${{ env.FRAPPE_SITE }}
          REQUIRED_FRAPPE_APPS: ${{ env.REQUIRED_FRAPPE_APPS }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
          REPOSITORY_URL: ${{ env.REPOSITORY_URL }}
        with:
          host: ${{ env.PROD_SERVER_HOST }}
          username: ${{ env.PROD_SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          envs: PROD_DEPLOY_PATH,FRAPPE_SITE,REQUIRED_FRAPPE_APPS,IMAGE_REF,REPOSITORY_URL
          script: |
            set -euo pipefail

            cd "$PROD_DEPLOY_PATH"

            require_cmd() {
              command -v "$1" >/dev/null 2>&1 || {
                echo "Missing required command: $1"
                exit 1
              }
            }

            check_apps() {
              local site="$1"
              local apps
              apps="$(docker compose exec -T backend bench --site "$site" list-apps | awk '{print $1}')"
              echo "$apps"
              IFS=',' read -ra required <<< "$REQUIRED_FRAPPE_APPS"
              for app in "${required[@]}"; do
                echo "$apps" | grep -qx "$app" || {
                  echo "Missing installed Frappe app: $app"
                  exit 1
                }
              done
              docker compose exec -T backend bench --site "$site" execute frappe.db.exists --args '["DocType", "Raven User"]' | grep -qi "true"
            }

            set_version_tag() {
              local tag="$1"
              if grep -q '^VERSION_TAG=' .env; then
                sed -i "s/^VERSION_TAG=.*/VERSION_TAG=${tag}/" .env
              else
                printf '\nVERSION_TAG=%s\n' "$tag" >> .env
              fi
            }

            rollback() {
              local exit_code="$?"
              trap - ERR
              if [[ "$DEPLOY_STARTED" == "1" && -n "$PREVIOUS_TAG" ]]; then
                echo "Deployment failed; rolling back to ${PREVIOUS_TAG}"
                DEPLOY_STARTED=0
                set_version_tag "$PREVIOUS_TAG"
                docker compose pull
                docker compose up -d --remove-orphans --scale create-site=0
                docker compose restart frontend websocket queue-short queue-long scheduler || true
              fi
              exit "$exit_code"
            }

            DEPLOY_STARTED=0
            PREVIOUS_TAG="$(grep -E '^VERSION_TAG=' .env 2>/dev/null | tail -n1 | cut -d= -f2- || true)"
            trap rollback ERR

            require_cmd docker
            require_cmd openssl
            docker compose version
            test -d .git
            test -f compose.yaml
            available_kb="$(df -Pk . | awk 'NR==2 {print $4}')"
            if [[ "$available_kb" -le 2097152 ]]; then
              docker image inspect yarsalabs/nepal-compliance:latest >/dev/null 2>&1 || {
                echo "Less than 2 GiB available and no approved legacy image can be reclaimed"
                exit 1
              }
            fi

            docker compose ps
            check_apps "$FRAPPE_SITE"
            docker compose exec -T backend bench --site "$FRAPPE_SITE" backup --with-files --compress

            echo "$PREVIOUS_TAG" > .last-deployed-tag

            git remote set-url origin "$REPOSITORY_URL"
            git fetch --tags origin
            git fetch origin main

            export VERSION_TAG="${IMAGE_REF##*:}"
            set_version_tag "$VERSION_TAG"
            if docker image inspect yarsalabs/nepal-compliance:latest >/dev/null 2>&1; then
              docker compose down --remove-orphans
              docker image rm yarsalabs/nepal-compliance:latest
              if ! docker pull "$IMAGE_REF"; then
                echo "Replacement pull failed; restoring the legacy stack"
                docker pull yarsalabs/nepal-compliance:latest
                docker compose up -d
                exit 1
              fi
            else
              docker pull "$IMAGE_REF"
            fi

            git checkout main
            git reset --hard origin/main

            if ! grep -qE '^STALWART_RECOVERY_ADMIN=.+$' .env; then
              printf '\nSTALWART_RECOVERY_ADMIN=admin:%s\n' "$(openssl rand -hex 24)" >> .env
            fi

            DEPLOY_STARTED=1
            docker compose pull
            docker compose up -d --remove-orphans --scale create-site=0
            bash scripts/configure-stalwart-reverse-proxy.sh
            bash scripts/install-required-apps.sh "$FRAPPE_SITE" "$REQUIRED_FRAPPE_APPS"
            bash scripts/configure-frappe-mail.sh
            docker compose restart frontend websocket queue-short queue-long scheduler
            sleep 15

            docker compose ps
            check_apps "$FRAPPE_SITE"
            docker compose ps --status running stalwart | grep -q stalwart
            curl -fsS --max-time 20 "http://127.0.0.1:8080/api/method/ping" | grep -q pong
            curl -fsS --max-time 20 "http://127.0.0.1:8080/raven" >/dev/null

            DEPLOY_STARTED=0
            docker image prune -f
            echo "Deploy complete: $(date -Iseconds)"

      - name: Purge Cloudflare cache
        if: ${{ vars.CLOUDFLARE_ZONE_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ vars.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | jq -e '.success == true'
